<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
</head>
<body>
    <h1>Testando carga e imagens</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta.</p>
    <img src="logo-html.png" alt="Logo">
    <p>Podemos também carregar imagens que estão em sub-pastas.</p>
    <img src="imagens/logo-css.png" alt="Logo CSS">
    <p>Também podemos carregar imagens externas.</p>
   <img src="https://logodownload.org/wp-content/uploads/2022/04/javascript-logo-0.png"
     alt="Logo JavaScript"
     width="200"
     height="200"> <!-- width e height são atributos para definir a largura e altura da imagem, respectivamente. -->
</body>
</html>

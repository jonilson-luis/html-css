<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>Vamos aprender a reproduzir audios em HTML5</h1>
    <audio src="midia/happy-mistake.mp3" controls autoplay></audio> <!--Formatos de audio geralmente suportados: MP3, WAV, OGG-->
    <audio preload="metadata" autoplay controls loop>
            <source src="midia/happy-mistake.mp3" type="audio/mpeg">
            <source src="midia/happy-mistake.ogg" type="audio/ogg">
            <source src="midia/happy-mistake.wav" type="audio/wav"> <!--o arquivo wave -->
            <p>Infelizmente seu navegador não consegue reproduzir audio. <a href="midia/happy-mistake.mp3">Clique aqui para baixar o arquivo MP3</a></p>
            
    </audio>
   
</body>
</html>
